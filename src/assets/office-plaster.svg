      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.045" numOctaves="4" seed="41" result="noise" />
      <feColorMatrix
        in="noise"
        values="0 0 0 0 0.18
                0 0 0 0 0.11
                0 0 0 0 0.055
                0.5 0 0 0 -0.17"
