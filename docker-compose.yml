services:
  postgres:
    image: postgres:16-alpine
    container_name: footwear-production-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: footwear_production_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - footwear_production_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d footwear_production_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  footwear_production_hub_pgdata:
